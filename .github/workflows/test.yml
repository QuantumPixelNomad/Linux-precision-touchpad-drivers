name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover tests
      - run: ./build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: winptp-deb
          path: dist/*.deb
